version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tempmail_postgres
    environment:
      POSTGRES_DB: tempmail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tempmail_network

  redis:
    image: redis:7-alpine
    container_name: tempmail_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tempmail_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tempmail_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/tempmail
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      DEBUG: "false"
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    restart: unless-stopped
    networks:
      - tempmail_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tempmail_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/api/v1/ws
    restart: unless-stopped
    networks:
      - tempmail_network

volumes:
  postgres_data:
  redis_data:
  backend_logs:

networks:
  tempmail_network:
    driver: bridge